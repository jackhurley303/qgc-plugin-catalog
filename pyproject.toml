[tool.ruff]
line-length = 100
target-version = "py312"
# A byte-identical copy of the plugin SDK's pack_plugin.py; see tools/validate_entry.py.
extend-exclude = ["tools/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
