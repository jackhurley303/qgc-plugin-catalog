name: Publish index

# Builds index.json from plugins/ after a merge and deploys it to GitHub Pages. It runs only on
# a push to main, never on a pull request, so a stranger's PR cannot reach the deploy step. It
# holds no secrets. The deploy job gets the two Pages permissions and nothing else.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Build index.json
        run: python tools/build_index.py plugins --out _site

      # The schemas' $id URLs point here.
      - name: Copy the schemas
        run: |
          mkdir -p _site/schema
          cp schema/*.json _site/schema/

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
